# Default permissions for the cadhy plugin
# This grants access to all cadhy commands

"$schema" = "schemas/schema.json"

[default]
description = "Default permissions for CADHY 3D plugin - grants access to all commands"
permissions = [
    # Project commands
    "allow-project-ping",
    "allow-project-new",
    "allow-project-undo",
    "allow-project-redo",
    "allow-project-can-undo",
    "allow-project-can-redo",
    # Viewport commands (fallback mode)
    "allow-viewport-init",
    "allow-viewport-is-initialized",
    "allow-viewport-render-frame",
    "allow-viewport-resize",
    "allow-viewport-get-size",
    "allow-viewport-set-camera",
    "allow-viewport-get-camera",
    "allow-viewport-orbit",
    "allow-viewport-pan",
    "allow-viewport-zoom",
    "allow-viewport-frame-selection",
    "allow-viewport-frame-all",
    "allow-viewport-set-view-mode",
    "allow-viewport-get-view-mode",
    "allow-viewport-reset-camera",
    "allow-viewport-set-settings",
    "allow-viewport-get-settings",
    "allow-viewport-is-dirty",
    "allow-viewport-clear-dirty",
    # Native viewport commands (high-performance mode)
    "allow-viewport-init-native",
    "allow-viewport-is-native",
    "allow-viewport-update-bounds",
    "allow-viewport-orbit-native",
    "allow-viewport-pan-native",
    "allow-viewport-zoom-native",
    "allow-viewport-get-fps",
    # Scene commands
    "allow-scene-get-objects",
    "allow-scene-add-object",
    "allow-scene-add-primitive",
    "allow-scene-add-cube",
    "allow-scene-remove-object",
    "allow-scene-select",
    "allow-scene-deselect-all",
    "allow-scene-get-selection",
    "allow-scene-set-transform",
    "allow-scene-get-transform",
]
