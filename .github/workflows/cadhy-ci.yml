name: CADHY Multi-Platform CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend tests (UI/UX)
  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Type check
      run: bun run type-check
    
    - name: Lint
      run: bun run lint
    
    - name: Build UI packages
      run: bun run build:ui

  # Rust backend tests
  test-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
        exclude:
          # Skip beta on Windows for faster CI
          - os: windows-latest
            rust: beta
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cargo test --all-features --workspace

  # WGPU rendering tests
  test-wgpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # Skip Windows for WGPU tests (GPU limitations)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
    
    - name: Test viewport modules
      run: cargo test -p cadhy-viewport --features wgpu
    
    - name: Test bridge integration
      run: cargo test -p cadhy-bridge --features tauri

  # Full integration build
  build-desktop:
    runs-on: ${{ matrix.os }}
    needs: [test-frontend, test-rust]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          node_modules/.cache
          ~/.bun/install/cache
        key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/bun.lock') }}
    
    - name: Install dependencies
      run: |
        bun install
        cargo fetch
    
    - name: Build Tauri app
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        args: --verbose
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cadhy-desktop-${{ matrix.os }}
        path: |
          src-tauri/target/release/bundle/
          src-tauri/target/release/cadhy-desktop*

  # Performance benchmarks
  benchmark:
    runs-on: ubuntu-latest
    needs: [build-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Run viewport benchmarks
      run: cargo bench -p cadhy-viewport
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: target/criterion/

  # Security audit
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Security audit (Cargo)
      uses: actions-rs/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Security audit (Bun)
      run: bun audit

  # Release deployment
  release:
    runs-on: ${{ matrix.os }}
    needs: [test-frontend, test-rust, test-wgpu, build-desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Build release
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: "CADHY ${{ github.ref_name }}"
        releaseBody: |
          ## CADHY Desktop Application
          
          ### 🚀 Features
          - High-performance 3D CAD rendering with WGPU
          - Native viewport integration (60+ FPS)
          - Modern React UI with TailwindCSS
          
          ### 📦 Installation
          Download the appropriate bundle for your platform:
          - Windows: `.msi` installer
          - macOS: `.dmg` disk image  
          - Linux: `.AppImage` portable app
          
          ### 🔧 Requirements
          - **Windows**: Windows 10+ with graphics drivers
          - **macOS**: macOS 10.15+ with Metal support
          - **Linux**: Modern graphics drivers (Vulkan 1.0+)
        
        args: --verbose
